services:
  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  ml-service:
    build: ./ml-service
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017
      JWT_SECRET: "${JWT_SECRET:-dev-only-secret-dev-only-secret-32bytes!}"
      CORS_ORIGIN: "${CORS_ORIGIN:-http://localhost:5173}"
      ML_URL: http://ml-service:8000
      AUTH_RATE_LIMIT: "${AUTH_RATE_LIMIT:-10}"
      JALKRISHI_WEATHER_BASE_URL: "${WEATHER_BASE_URL:-https://api.open-meteo.com}"
    depends_on:
      mongo:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: "${VITE_API_URL:-http://localhost:8080}"
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mongo_data:
